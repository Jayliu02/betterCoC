version: 1
template_root: templates
# 固定位置识别项：
#   type: point
#   point: [x, y]            # 1920x1080 归一化坐标，直接点击这里
#   check:                   # 可选，小区域平均颜色校验（BGR）
#     roi: [x, y, w, h]
#     color: [b, g, r]       # 也可写 [[...],[...]]，匹配正常/变暗等多组颜色
#     tolerance: 25          # 最大通道差值，越小越严格
# 坐标来自 1920x1080 截图；换分辨率或 UI 后需要重新校准。
defaults:
  threshold: 0.86
  grayscale: true
  method: ccoeff_normed
assets:
  home_attack:
    type: point
    point: [110, 935]
    check:
