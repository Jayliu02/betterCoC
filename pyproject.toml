[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bettercoc"
version = "0.1.0"
description = "Image-recognition automation framework for Clash of Clans"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "PyYAML>=6.0",
    "Pillow>=10.1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
bettercoc = "bettercoc.cli:main"

[tool.setuptools.packages.find]
include = ["bettercoc*"]
